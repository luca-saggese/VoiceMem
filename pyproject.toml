[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemem"
version = "0.2.3"
description = "Left-brain/right-brain memory framework with an audio-native perception layer (scene/speaker/emotion)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lang Jiaqi" }]
keywords = ["memory", "voice", "agent", "llm", "speech", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# `pip install voicemem` installa tutti i componenti built-in con un solo comando: ASR, VAD, voiceprint, scena, emozione,
# embedding locale, più le dipendenze per eseguire il web demo e examples/.
#
# In precedenza erano separati nell'extra [slm], dopo che l'utente installava il pacchetto base secondo il README ancora
# ModuleNotFoundError: funasr —— si chiama slm, nessuno si aspetterebbe che l'ASR sia lì dentro.
dependencies = [
    "numpy<2",             # onnxruntime/CosyVoice e alcuni moduli audio nativi usano ancora l'ABI NumPy 1.x
    "openai[realtime]",
    # ── audio chain ──
    "torch",
    "torchaudio",         # funasr lo importa internamente ma non lo dichiara da sé
    "torchvision",        # transformers per caricare Qwen2.5-Omni richiede Qwen2VLVideoProcessor,
                          # che importa torchvision. Se manca non dà errore, solo il attributore di emozione**silenziosamente**
                          # fa fallback al quadrante puramente acustico — "mi piacciono le fragole" verrebbe classificato come tristezza, tutto il cervello destro non funziona.
    "transformers==4.52.3",
    "accelerate",         # serve per from_pretrained(device_map="auto") dell'attributore emotivo,
                          # se manca è la stessa degradazione silenziosa, non un errore.
    "funasr",             # ASR streaming (predefinito)
    "modelscope",         # funasr lo usa per prendere i modelli
    "sherpa-onnx",        # VAD + voiceprint + ASR di fallback (puro onnx)
    "sentence-transformers",   # E5 locale (vettori memoria / classificazione slot)
    "soundfile",          # legge mp3/m4a/flac; se manca fa fallback a wave della libreria standard, riconosce solo PCM wav
    "scipy",
    # ── web demo (web/run.py) ed examples/ ──
    "fastapi",
    "uvicorn",
    "pydantic",           # importato al top-level da web/utils.py (fastapi può portarlo, ma non farci affidamento)
    "websockets>=14",     # uvicorn gestisce WebSocket; anche examples/05 per realtime lo usa
    "sounddevice",        # agent vocale negli examples: microfono + altoparlante
    "pywebrtc-audio",     # cancellazione eco (può interrompere quando si usa l'altoparlante)
    "av>=14",              # codec Opus per il trasporto WebSocket Xiaozhi
    "cryptography",        # AES-CTR per l'audio UDP del broker MQTT Xiaozhi
]

[project.optional-dependencies]

rtc = [
    "av>=14",
]

# Per eseguire il nostro modello Qwen fine-tuned per le risposte (Qwen3.6-35B-A3B + adapter QLoRA).
# I pesi non sono nel wheel, usa `bash scripts/download_models.sh --reply-adapter` per scaricarli.
slm = [
    "peft",               # carica adapter QLoRA
    "qwen-omni-utils",    # preprocessing multimodale degli input di Qwen-Omni
    "audioread",          # qwen-omni-utils lo importa al top-level ma non lo dichiara;
                          # se manca `import qwen_omni_utils` dà direttamente ModuleNotFoundError。
]

# Solo questi due comandi. Per gli altri scenari usa pip separatamente, senza aprire extra separati — un extra con nome che non corrisponde al contenuto
# è stato proprio la causa del problema precedente ([slm] conteneva ASR, nessuno se l'aspetterebbe):
#   TTS locale (TTS_BACKEND=local)  pip install piper-tts   oppure   pip install voxcpm
#   per eseguire gli script di training in finetune/         pip install ms-swift==4.5.2 bitsandbytes

[project.urls]
Homepage = "https://github.com/lang-jiaqi/Voicemem_open"
Repository = "https://github.com/lang-jiaqi/Voicemem_open"
Issues = "https://github.com/lang-jiaqi/Voicemem_open/issues"

[tool.setuptools.packages.find]
include = ["voicemem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# I testi dei prompt in data/ vengono letti a runtime (vedi leftbrain/mem0_additive_prompt_build.py),
# se non dichiarati esplicitamente non finiranno nel wheel, e dopo l'installazione un call darà FileNotFoundError.
[tool.setuptools.package-data]
# I testi dei prompt in data/ vengono letti a runtime (vedi leftbrain/mem0_additive_prompt_build.py),
# se non dichiarati esplicitamente non finiranno nel wheel, e dopo l'installazione una chiamata darà FileNotFoundError.
#
# assets/*.wav sono audio di esempio usati nel README e negli examples (1MB totali). Se non inclusi nel pacchetto,
# dopo l'installazione con pip il primo esempio del README darà LibsndfileError — è quella che è la prima impressione degli utenti. voicemem.sample_audio() cercherà prima assets/ nel repository, altrimenti farà fallback a questo.
"*" = ["data/*.txt", "*.txt", "assets/*.wav"]
